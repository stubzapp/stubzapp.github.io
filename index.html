<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stubz</title>
<meta name="description" content="Stubz turns every show you've been to into a ticket stub, a poster and the set list.">
<link rel="icon" href="stubz-icon.png">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px;
         font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; color:#FBFAF7; text-align:center;
         background:radial-gradient(ellipse at 50% 0%, #4A2E17 0%, #2A1A0E 55%, #160D07 100%); }
  main { max-width:420px; }
  img { width:120px; height:120px; border-radius:27px; box-shadow:0 14px 34px rgba(0,0,0,.45); }
  h1 { font-size:40px; font-weight:900; letter-spacing:1px; margin:22px 0 4px; }
  .tag { font:600 13px ui-monospace, Menlo, monospace; letter-spacing:4px; color:#F2C14E; }
  p { color:#E9E2D3; line-height:1.5; font-size:17px; }
  a { display:inline-block; margin-top:14px; padding:16px 28px; border-radius:999px; background:#C8102E; color:#fff;
      font-weight:700; font-size:17px; text-decoration:none; }
</style>
</head>
<body>
<main>
  <img src="stubz-icon.png" alt="Stubz app icon">
  <h1>STUBZ</h1>
  <div class="tag">CONCERT KEEPSAKES</div>
  <p>Every show you've been to becomes a ticket stub, a poster and the set list. Share them with friends.</p>
  <!-- Your Stubz App Store link (App Store Connect → App Information → Apple ID) -->
  <a href="https://apps.apple.com/app/id6820333545">Get Stubz on the App Store</a>
</main>
</body>
</html>
